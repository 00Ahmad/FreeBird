<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- FreeBird "The Tinkerer": a scruffy, smug little bird who builds his own gear. Flat colours, ink lines, sticker edge. -->
  <defs>
    <filter id="sticker" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="11" result="grown"/>
      <feFlood flood-color="#fff4dc"/>
      <feComposite in2="grown" operator="in" result="edge"/>
      <feOffset in="grown" dx="6" dy="9" result="drop"/>
      <feFlood flood-color="#06201e" flood-opacity="0.55"/>
      <feComposite in2="drop" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="#14524b"/>
  <circle cx="300" cy="230" r="190" fill="#1a635a"/>

  <!-- Scaled up so he fills the tile. -->
  <g transform="translate(256 268) scale(1.16) translate(-273 -285)">
  <g filter="url(#sticker)" stroke="#1e1a22" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- Wrench over his shoulder, behind him. -->
    <path d="M 214 318 L 118 196 C 96 196 82 178 88 156 L 106 172 L 124 160 L 118 138 C 140 132 160 150 156 172 L 248 290 Z" fill="#b8bec6"/>

    <!-- Ragged tail. -->
    <path d="M 168 352 L 86 390 L 116 400 L 84 432 L 132 422 L 124 448 L 190 400 Z" fill="#e0901a"/>

    <!-- Feet. -->
    <path d="M 226 432 L 222 462 M 222 462 L 204 466 M 222 462 L 236 470 M 290 434 L 292 462 M 292 462 L 276 468 M 292 462 L 308 466" fill="none" stroke="#e8582f" stroke-width="10"/>

    <!-- Body: a slightly lopsided bean. -->
    <path d="M 154 334 C 146 238 212 168 294 170 C 384 173 424 248 410 330 C 398 408 330 446 256 442 C 190 438 160 398 154 334 Z" fill="#f4b71e"/>
    <!-- Belly. -->
    <path d="M 238 438 C 214 392 236 330 300 316 C 352 306 396 320 406 346 C 392 404 330 444 238 438 Z" fill="#fff0c4" stroke-width="7"/>

    <!-- Scruffy head feathers. -->
    <path d="M 246 180 C 230 156 222 132 232 110 C 248 128 258 148 266 168 C 266 138 276 114 300 100 C 302 128 296 150 290 172 C 302 156 320 146 342 150 C 330 166 316 176 306 184 Z" fill="#f4b71e"/>

    <!-- Band-aid on his belly. -->
    <g transform="rotate(-24 300 392)">
      <rect x="262" y="378" width="78" height="28" rx="13" fill="#f2c9a4" stroke-width="6"/>
      <rect x="290" y="380" width="22" height="24" fill="#e6b38a" stroke="none"/>
      <g fill="#1e1a22" stroke="none"><circle cx="274" cy="392" r="2.5"/><circle cx="328" cy="388" r="2.5"/><circle cx="326" cy="398" r="2.5"/></g>
    </g>

    <!-- Wing gripping the wrench. -->
    <path d="M 172 322 C 176 276 230 256 264 290 C 270 318 256 346 230 362 L 220 346 L 208 366 L 196 350 L 182 362 C 172 350 170 336 172 322 Z" fill="#e0901a"/>
    <path d="M 206 304 C 220 300 236 304 246 314" fill="none" stroke-width="6"/>

    <!-- Eyes: left one half-lidded and smug, right one wide under a raised brow. -->
    <ellipse cx="300" cy="266" rx="27" ry="30" fill="#ffffff"/>
    <circle cx="310" cy="274" r="12" fill="#1e1a22" stroke="none"/>
    <path d="M 271 262 C 280 246 320 244 329 262 Z" fill="#f4b71e" stroke-width="7"/>
    <ellipse cx="364" cy="258" rx="22" ry="27" fill="#ffffff"/>
    <circle cx="372" cy="264" r="10" fill="#1e1a22" stroke="none"/>
    <path d="M 344 222 L 384 210" fill="none" stroke-width="10"/>

    <!-- Beak with a smirk. -->
    <path d="M 388 286 C 420 282 448 290 462 304 C 432 310 410 308 390 306 Z" fill="#e8582f"/>
    <path d="M 392 308 C 412 312 430 314 440 318 C 424 330 404 330 394 322 Z" fill="#c4421f" stroke-width="7"/>

    <!-- Welding goggles pushed up on his forehead; the left lens is cracked and taped. -->
    <path d="M 182 236 C 230 200 330 186 404 204" fill="none" stroke-width="16"/>
    <path d="M 182 236 C 230 200 330 186 404 204" fill="none" stroke="#5a4a3c" stroke-width="8"/>
    <circle cx="280" cy="204" r="30" fill="#c8923b"/>
    <circle cx="280" cy="204" r="18" fill="#58c7c0" stroke-width="6"/>
    <circle cx="346" cy="198" r="30" fill="#c8923b"/>
    <circle cx="346" cy="198" r="18" fill="#58c7c0" stroke-width="6"/>
    <path d="M 270 196 L 284 206 L 278 214" fill="none" stroke-width="4"/>
    <g transform="rotate(-30 280 204)"><rect x="248" y="196" width="64" height="16" rx="2" fill="#cfd3d8" stroke-width="5"/></g>
    <g transform="rotate(30 280 204)"><rect x="248" y="196" width="64" height="16" rx="2" fill="#cfd3d8" stroke-width="5"/></g>

    <!-- Cheek. -->
    <ellipse cx="350" cy="306" rx="16" ry="9" fill="#ff9a8b" stroke="none" opacity="0.8"/>
  </g>
  </g>
</svg>
